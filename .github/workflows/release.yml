name: Derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki release oluşmasın; sıraya girsinler.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK bileşenleri
        run: |
          # pipefail yok: `yes` boruyu kapatınca SIGPIPE ile ölür, adım hata sanmasın.
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret'i yok — release debug anahtarıyla imzalanacak." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=release" >> "$GITHUB_ENV"

      - name: Sürüm numarası
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION="$(./gradlew -q --no-daemon :app:printVersionName | tail -n 1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "Sürüm adı okunamadı" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: APK derle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK'yı adlandır
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="isimsehir-$VERSION.apk"
          mv "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"

      - name: Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "İsim Şehir v$VERSION" \
            --generate-notes
